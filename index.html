<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack — Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============ EXERCISE PICKER SCREEN ============ -->
  <div id="screen-picker" class="screen active">
    <header class="top-bar">
      <h1 class="logo">FitTrack</h1>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
    </header>

    <div class="picker-body">
      <h2>Choose an Exercise</h2>

      <div class="category-tabs">
        <button class="tab active" data-category="hiit">HIIT</button>
        <button class="tab" data-category="strength">Strength</button>
        <button class="tab" data-category="custom">Custom</button>
      </div>

      <ul id="exercise-list" class="exercise-list"></ul>

      <!-- Custom exercise input -->
      <div id="custom-input" class="custom-input hidden">
        <input type="text" id="custom-name" placeholder="Exercise name" maxlength="30">
        <button id="add-custom-btn" class="btn btn-sm">+ Add</button>
      </div>
    </div>
  </div>

  <!-- ============ SETUP SCREEN ============ -->
  <div id="screen-setup" class="screen">
    <header class="top-bar">
      <button id="back-to-picker" class="icon-btn" aria-label="Back">&larr;</button>
      <h1 id="setup-title" class="logo">Exercise</h1>
      <div></div>
    </header>

    <div class="setup-body">
      <p class="hint">Set your targets. We'll remember them next time.</p>

      <div class="setup-field">
        <label for="input-sets">Total Sets</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="input-sets" data-dir="-1">&minus;</button>
          <input type="number" id="input-sets" value="3" min="1" max="50">
          <button class="stepper-btn" data-target="input-sets" data-dir="1">+</button>
        </div>
      </div>

      <div class="setup-field">
        <label for="input-reps">Reps per Set</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="input-reps" data-dir="-1">&minus;</button>
          <input type="number" id="input-reps" value="10" min="1" max="200">
          <button class="stepper-btn" data-target="input-reps" data-dir="1">+</button>
        </div>
      </div>

      <div class="setup-field">
        <label for="input-weight">Weight (lbs)</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="input-weight" data-dir="-5">&minus;</button>
          <input type="number" id="input-weight" value="0" min="0" max="2000" step="5">
          <button class="stepper-btn" data-target="input-weight" data-dir="5">+</button>
        </div>
      </div>

      <div class="setup-field">
        <label for="input-rest">Rest Timer (sec)</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="input-rest" data-dir="-5">&minus;</button>
          <input type="number" id="input-rest" value="30" min="5" max="300" step="5">
          <button class="stepper-btn" data-target="input-rest" data-dir="5">+</button>
        </div>
      </div>

      <div id="previous-stats" class="previous-stats hidden">
        <p>Last time: <span id="prev-summary"></span></p>
      </div>

      <button id="start-workout-btn" class="btn btn-primary btn-lg">Start Workout</button>
    </div>
  </div>

  <!-- ============ WORKOUT SCREEN ============ -->
  <div id="screen-workout" class="screen">
    <header class="top-bar">
      <button id="quit-workout" class="icon-btn" aria-label="Quit workout">&larr;</button>
      <h1 id="workout-title" class="logo">Exercise</h1>
      <button id="theme-toggle-2" class="icon-btn" aria-label="Toggle dark mode">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
    </header>

    <div class="workout-body">
      <!-- Timer -->
      <div id="timer-container" class="timer-container">
        <div id="timer-ring" class="timer-ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="54" />
            <circle id="ring-progress" class="ring-fg" cx="60" cy="60" r="54" />
          </svg>
          <div class="timer-text">
            <span id="timer-display" class="timer-display">0:30</span>
            <span id="timer-label" class="timer-label">REST</span>
          </div>
        </div>
      </div>

      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="stat-set">1/3</span>
          <span class="stat-label">SET</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-reps">10</span>
          <span class="stat-label">REPS</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-weight">0</span>
          <span class="stat-label">LBS</span>
        </div>
      </div>

      <!-- Reps adjuster -->
      <div class="reps-adjuster">
        <p class="hint">Actual reps this set:</p>
        <div class="stepper stepper-lg">
          <button id="reps-minus" class="stepper-btn">&minus;</button>
          <span id="actual-reps" class="actual-reps">10</span>
          <button id="reps-plus" class="stepper-btn">+</button>
        </div>
      </div>

      <!-- Action button -->
      <button id="complete-set-btn" class="btn btn-primary btn-lg">Complete Set</button>

      <!-- Total reps so far -->
      <p class="total-reps">Total reps so far: <strong id="total-reps">0</strong></p>
    </div>
  </div>

  <!-- ============ DONE SCREEN ============ -->
  <div id="screen-done" class="screen">
    <header class="top-bar">
      <div></div>
      <h1 class="logo">FitTrack</h1>
      <div></div>
    </header>

    <div class="done-body">
      <div class="done-icon">&#10003;</div>
      <h2>Workout Complete!</h2>
      <div id="done-summary" class="done-summary"></div>
      <button id="done-btn" class="btn btn-primary btn-lg">Back to Exercises</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
